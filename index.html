<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="클라로">
<meta name="theme-color" content="#E3EAF2">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<title>클라로 Klaro</title>
<style>
  /* ===== KLARO · Edge Light =====
     아크릴 절단면이 빛나는 현상을 인터페이스의 시그니처로 삼는다.
     모든 작업 카드의 좌측 엣지가 소재 색으로 발광하고,
     치수/수량은 재단 리스트처럼 고정폭 서체로 정렬된다. */
  :root{
    /* 세명아크릴 로고 3단 블루 */
    --sky:#81CEEC;          /* 로고 1번 사선 - 하늘 */
    --azure:#008CC9;        /* 로고 2번 사선 - 코어 블루 */
    --cobalt:#2E5DA6;       /* 로고 3번 사선 - 코발트 */
    --navy:#0A2544;         /* 로고 글자 남색 */
    --ink:#0A2544;
    --ink-2:#40587A;
    --ink-3:#8496AF;
    --floor:#E3EAF2;        /* 배경 */
    --floor-2:#F1F5FA;
    --panel:#FFFFFF;
    --edge:#008CC9;         /* 강조 = 로고 코어 블루 */
    --edge-deep:#00659A;
    --amber:#D9931B;
    --alert:#D6453B;
    --r:4px;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button,.mic-zone,.section-head,header,.grp-head{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;touch-action:manipulation;
  }
  html,body{height:100%;}
  body{
    font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--floor);
    background-image:
      linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 220px),
      repeating-linear-gradient(90deg,rgba(10,37,68,.03) 0 1px,transparent 1px 34px);
    color:var(--ink);
    display:flex;justify-content:center;min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:520px;padding:18px 16px 44px;}

  /* ---- 상단 ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding-bottom:14px;margin-bottom:16px;
    border-bottom:1px solid rgba(10,37,68,.12);
  }
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{
    width:24px;height:19px;flex-shrink:0;
    background:
      linear-gradient(105deg,
        transparent 0 8%, var(--sky) 8% 26%,
        transparent 26% 34%, var(--azure) 34% 56%,
        transparent 56% 64%, var(--cobalt) 64% 92%,
        transparent 92%);
  }
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
  .brand-sub{
    font-size:10.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:-.01em;margin-top:1px;
  }
  .head-right{display:flex;align-items:center;gap:7px;}
  .me-chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--panel);border:1px solid rgba(10,37,68,.1);
    border-radius:99px;padding:5px 11px;
    font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;
  }
  .sync{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--panel);border:1px solid rgba(10,37,68,.1);
    border-radius:99px;padding:5px 10px;
    font-size:11.5px;font-weight:700;color:var(--ink-2);line-height:1;
  }

  /* ---- 조작 패널: 장비처럼 어둡게 ---- */
  .mic-zone{
    background:linear-gradient(168deg,#123055,#08192E);
    border:1px solid #1E4372;
    border-radius:var(--r);
    padding:22px 18px 18px;text-align:center;
    box-shadow:0 10px 30px rgba(10,37,68,.28),inset 0 1px 0 rgba(255,255,255,.06);
    margin-bottom:12px;position:relative;overflow:hidden;
  }
  .mic-zone::before{ /* 상단 엣지 라이트 */
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,140,201,.85),transparent);
  }
  .mic-row{display:flex;justify-content:center;gap:22px;}
  .mic-btn{
    width:84px;height:84px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,255,255,.1);
    background:
      radial-gradient(circle at 50% 120%, rgba(0,140,201,.22), transparent 62%),
      rgba(255,255,255,.06);
    color:#D6E6F5;font-size:31px;
    transition:transform .12s ease, background .12s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .mic-btn:hover{background:rgba(255,255,255,.1);}
  .mic-btn:active{transform:scale(.94);}
  .mic-btn:active{transform:scale(.94);}
  .mic-btn.listening{
    background:radial-gradient(circle at 34% 30%,#FF8574,var(--alert) 55%,#9E2C24);
    color:#fff;box-shadow:0 0 0 1px rgba(214,69,59,.5),0 0 26px rgba(214,69,59,.5);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(214,69,59,.4);}
    70%{box-shadow:0 0 0 20px rgba(214,69,59,0);}
    100%{box-shadow:0 0 0 0 rgba(214,69,59,0);}
  }
  .hold-btn.holding{
    background:var(--alert);border-color:var(--alert);color:#fff;transform:scale(.96);
  }
  .mic-guide{
    margin-top:16px;font-size:12.5px;font-weight:600;
    color:rgba(220,232,238,.62);
  }
  #earBadge{
    margin-top:8px;font-family:var(--mono);
    font-size:10px;font-weight:500;letter-spacing:.1em;
    color:rgba(0,140,201,.8);
  }
  .live{
    margin-top:14px;min-height:44px;text-align:left;
    background:rgba(255,255,255,.05);border-left:2px solid var(--edge);
    padding:10px 12px;font-size:14.5px;line-height:1.55;
    color:#D6E6F5;display:none;
  }
  .live.show{display:block;}
  .live .interim{color:#6B87A8;}

  /* ---- 입력 ---- */
  .type-zone{
    background:var(--panel);border:1px solid rgba(10,37,68,.09);
    border-radius:var(--r);padding:11px;margin-bottom:10px;
  }
  .type-zone label{
    display:block;margin-bottom:7px;
    font-family:var(--mono);font-size:10.5px;font-weight:500;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  }
  .type-row{display:flex;gap:7px;}
  .type-row input{
    flex:1;min-width:0;border:1px solid rgba(10,37,68,.15);border-radius:var(--r);
    padding:11px 12px;font-size:15px;font-family:inherit;outline:none;
    background:var(--floor-2);color:var(--ink);
  }
  .type-row input::placeholder{color:var(--ink-3);}
  .type-row input:focus{border-color:var(--edge);background:#fff;box-shadow:0 0 0 3px rgba(0,140,201,.13);}
  .type-row button{
    border:none;border-radius:var(--r);padding:0 17px;
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .type-row button:disabled{opacity:.45;}
  .photo-btn{
    flex:1;width:100%;
    border:1px solid rgba(10,37,68,.15)!important;border-radius:var(--r);
    padding:14px 16px!important;background:var(--panel)!important;
    color:var(--ink)!important;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .photo-btn:active{background:var(--floor-2)!important;}

  /* ---- 상태 / 오류 ---- */
  .status{
    display:none;align-items:center;gap:9px;margin-bottom:12px;
    padding:11px 13px;background:var(--panel);
    border-left:2px solid var(--edge);border-radius:var(--r);
    font-size:13.5px;color:var(--ink-2);
  }
  .status.show{display:flex;}
  .spinner{
    width:14px;height:14px;border-radius:50%;flex-shrink:0;
    border:2px solid rgba(10,37,68,.13);border-top-color:var(--edge);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{
    display:none;margin-bottom:12px;padding:11px 13px;
    background:#FDECEA;border-left:2px solid var(--alert);border-radius:var(--r);
    font-size:13px;line-height:1.55;color:#8E2C24;
  }
  .error-box.show{display:block;}
  .jarvis{
    display:none;margin-bottom:12px;padding:14px 16px;
    background:linear-gradient(150deg,#123055,#08192E);
    border-left:2px solid var(--edge);border-radius:var(--r);
    color:#D6E6F5;font-size:14.5px;line-height:1.6;
    box-shadow:0 8px 22px rgba(10,37,68,.24);
  }
  .jarvis.show{display:block;}
  .jarvis .jtitle{
    font-family:var(--mono);font-size:10px;font-weight:500;
    letter-spacing:.14em;color:var(--edge);margin-bottom:5px;
  }
  .brief{
    display:none;margin-bottom:12px;padding:11px 13px;
    background:#FFF7E6;border-left:2px solid var(--amber);border-radius:var(--r);
    font-size:13.5px;line-height:1.5;color:#7A5308;
  }
  .brief.show{display:flex;align-items:center;gap:9px;}
  .brief .btext{flex:1;}
  .brief button{
    border:none;border-radius:var(--r);padding:7px 12px;flex-shrink:0;
    background:var(--amber);color:#fff;font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }

  /* ---- 섹션 ---- */
  .section{margin-bottom:22px;}
  .section-head{
    display:flex;align-items:center;gap:7px;
    padding-bottom:7px;margin-bottom:9px;
    border-bottom:1px solid rgba(10,37,68,.13);
  }
  .section-head .t{
    font-size:12px;font-weight:800;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-2);
  }
  .count,.dict-count{
    font-family:var(--mono);font-size:11px;font-weight:700;
    color:#fff;border-radius:2px;padding:2px 7px;min-width:22px;text-align:center;
  }
  .count.todo{background:var(--ink);}
  .count.note{background:var(--amber);}
  .dict-count{background:var(--ink-3);}
  .sort-btn{
    margin-left:auto;border:1px solid rgba(10,37,68,.16);border-radius:99px;
    padding:4px 11px;background:transparent;color:var(--ink-2);
    font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .sort-btn:disabled{opacity:.4;}
  .empty{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:var(--ink-3);padding:10px 2px;
  }
  .grp-head{
    display:flex;align-items:center;gap:7px;margin:15px 0 8px;
    font-size:12.5px;font-weight:800;color:var(--ink-2);
  }
  .grp-head::before{
    content:'';width:14px;height:11px;flex-shrink:0;
    transform:skewX(-22deg);border-radius:1px;
  }
  .grp-head.g-재단::before{background:var(--sky);}
  .grp-head.g-가공::before{background:var(--azure);}
  .grp-head.g-후작업::before{background:var(--cobalt);}
  .grp-head.g-기타::before{background:var(--ink-3);}
  .grp-head .line{display:none;}
  .grp-head.g-empty{color:var(--ink-3);opacity:.6;}

  /* ---- 작업 카드: 작업번호 헤드 + 스펙 라인 (시안 반영) ---- */
  .item{
    position:relative;display:flex;gap:10px;align-items:flex-start;
    background:var(--panel);border-radius:6px;
    padding:13px 14px 13px 16px;margin-bottom:8px;
    font-size:15px;line-height:1.45;color:var(--ink);
    box-shadow:0 1px 3px rgba(10,37,68,.08);
    animation:slidein .26s ease;
  }
  .item::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    border-radius:6px 0 0 6px;
  }
  .item.work::before{background:var(--azure);box-shadow:0 0 10px rgba(0,140,201,.45);}
  .item.w-재단::before{background:var(--sky);box-shadow:0 0 10px rgba(129,206,236,.6);}
  .item.w-가공::before{background:var(--azure);box-shadow:0 0 10px rgba(0,140,201,.5);}
  .item.w-후작업::before{background:var(--cobalt);box-shadow:0 0 10px rgba(46,93,166,.5);}
  .item.memo::before{background:var(--amber);box-shadow:0 0 10px rgba(217,147,27,.4);}
  .item.done{opacity:.45;box-shadow:none;background:rgba(255,255,255,.65);}
  .item.done::before{box-shadow:none;background:rgba(10,37,68,.18)!important;}
  .item.done .job-title,.item.done .job-sub{text-decoration:line-through;}
  @keyframes slidein{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  .item .body{flex:1;cursor:pointer;min-width:0;}

  /* 카드 1행: 순번 + 작업번호 ... 시간 */
  .job-head{display:flex;align-items:center;gap:7px;}
  .ord{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;border-radius:3px;padding:0 4px;flex-shrink:0;
    background:var(--floor-2);border:1px solid rgba(10,37,68,.13);color:var(--ink-2);
    font-family:var(--mono);font-size:10.5px;font-weight:700;
  }
  .job-title{
    font-family:var(--mono);font-size:15px;font-weight:700;
    letter-spacing:.01em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .job-due{
    margin-left:auto;flex-shrink:0;
    font-size:12.5px;font-weight:700;color:var(--ink-3);
  }
  .job-due.urgent{color:var(--alert);}

  /* 카드 2행: 업체·내용 */
  .job-sub{margin-top:5px;font-size:14px;color:var(--ink-2);}
  .job-note{margin-top:5px;font-size:12.5px;color:var(--ink-3);line-height:1.45;}

  .chk{
    flex-shrink:0;width:22px;height:22px;border-radius:4px;
    border:2px solid rgba(10,37,68,.2);background:#fff;
    cursor:pointer;font-size:12px;line-height:1;padding:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .item.work.done .chk{background:var(--edge);border-color:var(--edge);}
  .item.memo .chk{border-color:rgba(217,147,27,.5);}
  .item.memo.done .chk{background:var(--amber);border-color:var(--amber);}
  .item button.del{
    border:none;background:none;color:var(--ink-3);opacity:.4;
    font-size:14px;cursor:pointer;padding:2px;flex-shrink:0;
  }
  .badge{
    display:inline-block;margin-right:5px;vertical-align:1px;
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.06em;border-radius:3px;padding:2px 5px;
  }
  .badge.p1{background:var(--alert);color:#fff;}
  .badge.p2{background:#FCEFD3;color:#8A5D07;}
  .badge.p3{display:none;}
  .who-tag{
    display:inline-block;margin-left:6px;vertical-align:1px;
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.05em;border-radius:3px;padding:2px 5px;
    background:rgba(10,37,68,.06);color:var(--ink-3);
  }

  /* ---- 스펙 라인: 소재 | 색칩 | 두께 치수 수량 (시안 반영) ---- */
  .specs{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
  .spec-row{
    display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  }
  .sp-mat{font-family:inherit;font-size:12.5px;color:var(--ink-3);font-weight:600;}
  .sp{
    display:inline-block;font-family:var(--mono);
    font-size:11.5px;font-weight:700;letter-spacing:.01em;
    border-radius:3px;padding:2.5px 8px;line-height:1.25;
    background:var(--floor-2);border:1px solid rgba(10,37,68,.12);color:var(--ink-2);
  }
  .sp-t,.sp-size,.sp-qty{
    background:none;border:none;padding:0;
    font-size:12.5px;font-weight:700;color:var(--ink);
  }
  .sp-size{font-variant-numeric:tabular-nums;}
  .sp-qty{color:var(--ink-3);}
  .sp-clear{background:linear-gradient(135deg,rgba(0,140,201,.12),#fff);border-style:dashed;border-color:rgba(0,140,201,.45);color:var(--edge-deep);}
  .sp-white{background:#fff;border-color:rgba(10,37,68,.22);color:var(--ink-2);}
  .sp-black{background:#101C2B;border-color:#101C2B;color:#fff;}
  .sp-mirror{background:linear-gradient(120deg,#F0F6FB,#AEC2D5,#F0F6FB);border-color:#A3B8CC;color:#27405C;}
  .sp-smoke{background:#5F7286;border-color:#5F7286;color:#fff;}
  .sp-brown{background:#7E5326;border-color:#7E5326;color:#fff;}
  .sp-blue{background:#2B5FA8;border-color:#2B5FA8;color:#fff;}

  /* ---- 접기 ---- */
  .fold-head{cursor:pointer;}
  .fold-arrow{margin-left:auto;font-size:11px;color:var(--ink-3);transition:transform .2s ease;}
  .fold-head.open .fold-arrow{transform:rotate(180deg);}
  .fold-body{display:none;}
  .fold-body.open{display:block;}
  .dict-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .dict-chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--floor-2);border:1px solid rgba(10,37,68,.11);border-radius:2px;
    padding:4px 6px 4px 9px;font-size:13px;font-weight:600;color:var(--ink-2);
  }
  .dict-chip button{
    border:none;background:none;color:var(--ink-3);
    cursor:pointer;font-size:12px;padding:0 2px;font-family:inherit;
  }

  /* ---- 사용자 선택 ---- */
  .user-overlay{
    position:fixed;inset:0;z-index:50;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:28px;
    background:linear-gradient(168deg,#123055,#08192E);
  }
  .user-overlay.show{display:flex;}
  .user-overlay h2{
    font-family:var(--mono);font-size:12px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;color:var(--edge);margin-bottom:14px;
  }
  .user-btn{
    width:100%;max-width:290px;border:1px solid rgba(255,255,255,.14);
    border-radius:var(--r);padding:17px;background:rgba(255,255,255,.05);
    font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;color:#D6E6F5;
    display:flex;align-items:center;gap:11px;
    transition:all .12s ease;
  }
  .user-btn:active{transform:scale(.98);}
  .user-btn.u-boss{border-left:3px solid var(--cobalt);}
  .user-btn.u-machine{border-left:3px solid var(--azure);}
  .user-btn.u-cutter{border-left:3px solid var(--sky);}

  .clear-row{text-align:center;margin-top:22px;}
  .clear-row button{
    border:none;background:none;color:var(--ink-3);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
    text-decoration:underline;cursor:pointer;
  }
  footer{
    margin-top:26px;text-align:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--ink-3);
  }
</style>
</head>
<body>
<div class="user-overlay" id="userOverlay">
  <h2>누구세요?</h2>
  <button class="user-btn u-boss" onclick="pickUser('보스')">👨‍✈️ 보스</button>
  <button class="user-btn u-machine" onclick="pickUser('머신')">🛠️ 머신</button>
  <button class="user-btn u-cutter" onclick="pickUser('커터')">✂️ 커터</button>
</div>

<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>Klaro</h1>
        <div class="brand-sub">세명아크릴 작업관리</div>
      </div>
    </div>
    <div class="head-right">
      <span class="sync off" id="syncState">·</span>
      <span class="me-chip" id="meChip" onclick="showUserPick()">👤 <span id="meName">?</span></span>
    </div>
  </header>

  <div class="mic-zone">

/* ---------- 상태 진단 표시 ---------- */
const debugLine = document.getElementById('debugLine');
function dbg(msg){

}

/* ---------- 시작 신호음 (삐) ---------- */
let audioCtx = null;
function beep(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  }catch(_){}
}

/* ---------- 음성 안내 (TTS) ---------- */
function speak(msg, done){
  try{
    const u = new SpeechSynthesisUtterance(msg);
    u.lang = 'ko-KR';
    u.rate = 1.05;
    let called = false;
    const fin = ()=>{ if(!called){ called = true; done && done(); } };
    u.onend = fin;
    u.onerror = fin;
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 1800);
  }catch(_){ done && done(); }
}

/* ---------- 음성 인식 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let listening = false;
let stopping = false;
let stopTimer = null;
let finalText = '';
let interimText = '';
let altNotes = [];      // 인식 후보 (교정용)
let sessionBase = '';   // 자동 재연결 이전까지 확정된 말
let sessionAltBase = []; // 이전 세션의 후보들
let restartCount = 0;
let restartWindow = 0;
let silenceTimer = null;   // 말 없으면 자동 종료
let maxTimer = null;       // 최대 녹음 시간
const SILENCE_BEFORE = 12; // 말 시작 전에는 12초까지 기다림
const SILENCE_AFTER = 5;   // 말 시작 후 침묵 5초면 자동 마무리
const MAX_SEC = 90;        // 최대 90초
let hasSpeech = false;     // 이번 녹음에서 말이 나왔는지

function armSilenceTimer(){
  if (silenceTimer) clearTimeout(silenceTimer);
  const sec = hasSpeech ? SILENCE_AFTER : SILENCE_BEFORE;
  silenceTimer = setTimeout(()=>{
    if (listening){ dbg('🤫 말이 없어서 자동 마무리'); wsStop(); }
  }, sec * 1000);
}
function clearTimers(){
  if (silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
  if (maxTimer){ clearTimeout(maxTimer); maxTimer = null; }
}

if (SR) {
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 4;

  rec.onstart = () => { dbg('🔴 마이크 켜짐! 말씀하세요'); };

  rec.onresult = (e) => {
    // 갤럭시(안드로이드)는 이미 보낸 말을 통째로 다시 보내는 버릇이 있어서,
    // 이어붙이지 않고 매번 처음부터 전체를 다시 조립한다 (중복 방지)
    let curFinal = '';
    let curInterim = '';
    const curAlts = [];
    let lastSeg = '';
    for (let i = 0; i < e.results.length; i++) {
      const t = (e.results[i][0].transcript || '');
      if (e.results[i].isFinal) {
        const seg = t.trim();
        // 갤럭시가 같은 조각을 연달아 여러 번 보내면 첫 번째만 받기
        if (!seg || seg === lastSeg) continue;
        lastSeg = seg;
        curFinal += seg + ' ';
        const conf = e.results[i][0].confidence;
        const alts = [];
        for (let a = 1; a < e.results[i].length; a++) {
          const at = (e.results[i][a].transcript || '').trim();
          if (at && at !== seg) alts.push(at);
        }
        if (alts.length || (conf !== undefined && conf < 0.75)) {
          const note = { 들린말: seg };
          if (alts.length) note['후보'] = alts;
          if (conf !== undefined && conf < 0.75) note['자신없음'] = true;
          curAlts.push(note);
        }
      }
      else curInterim += t;
    }
    // 재연결 직후, 새 세션이 앞 세션 끝부분을 또 보내면 겹치는 만큼 잘라내기
    finalText = sessionBase + trimOverlap(sessionBase, curFinal);
    interimText = curInterim;
    altNotes = sessionAltBase.concat(curAlts);
    dbg('🟢 목소리 인식되는 중');
    hasSpeech = true;
    armSilenceTimer();
    live.classList.add('show');
    live.innerHTML = escapeHtml(collapseRepeats(finalText)) + ' <span class="interim">' + escapeHtml(interimText) + '</span>';
  };

  rec.onerror = (e) => {
    dbg('⚠️ 오류 발생: <b>' + e.error + '</b>');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      clearTimers();
      resetMicUI();
      listening = false;
      showError('마이크 사용이 막혀 있어요. 원인: <b>' + e.error + '</b><br>· 컴퓨터라면: 주소창 왼쪽 자물쇠 → 마이크 → 허용<br>· 아이폰이라면: 설정 → 일반 → 키보드 → "받아쓰기" 켜기 확인');
    }
  };

  rec.onend = () => {
    if (stopping) {
      dbg('⏹ 녹음 종료, 정리 시작');
      finalizeRecording();
    } else if (listening) {
      const now = Date.now();
      if (now - restartWindow > 3000) { restartWindow = now; restartCount = 0; }
      restartCount++;
      if (restartCount > 6) {
        listening = false;
        resetMicUI();
        dbg('⛔ 이 브라우저에서 연속 인식이 불안정해요');
        showError('이 환경에서는 음성 인식이 계속 끊겨요. <b>사파리에서 직접 열었는지</b> 확인해주세요.');
        return;
      }
      dbg('🔄 잠깐 끊김, 다시 연결 중...');
      sessionBase = finalText;      // 여기까지는 확정
      sessionAltBase = altNotes.slice();
      setTimeout(() => {
        if (listening && !stopping) { try { rec.start(); } catch(_){} }
      }, 150);
    } else {
      dbg('마이크 꺼짐');
    }
  };
}

micBtn.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- AI 귀 (녹음 → Whisper) ---------- */
function okey(){ return document.getElementById('okeyInput').value.trim(); }
function aiEar(){ return !!okey(); }

let mediaRec = null, mediaChunks = [], mediaStream = null, recTick = null, recStartAt = 0, aiMaxTimer = null;

async function aiStart(){
  hideError();
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  }catch(e){
    showError('마이크 권한이 필요해요. 브라우저에서 마이크를 허용해주세요.');
    return;
  }
  mediaChunks = [];
  let mime = '';
  if (window.MediaRecorder){
    if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    else if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
  } else {
    showError('이 브라우저는 녹음을 지원하지 않아요.');
    return;
  }
  try{
    mediaRec = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
  }catch(e){
    mediaRec = new MediaRecorder(mediaStream);
  }
  mediaRec.ondataavailable = ev => { if (ev.data && ev.data.size) mediaChunks.push(ev.data); };
  mediaRec.onstop = aiFinish;
  mediaRec.start();
  listening = true;
  recStartAt = Date.now();
  micBtn.classList.add('listening');
  micBtn.textContent = '⏹';
  beep();
  live.classList.add('show');
  live.innerHTML = '🎧 AI 귀로 듣는 중... <span class="interim">0초</span>';
  recTick = setInterval(()=>{
    const s = Math.round((Date.now()-recStartAt)/1000);
    live.innerHTML = '🎧 AI 귀로 듣는 중... <span class="interim">' + s + '초</span>';
  }, 1000);
  aiMaxTimer = setTimeout(()=>{ if (listening) aiStop(); }, MAX_SEC * 1000);
}

function aiStop(){
  if (!mediaRec || !listening) return;
  listening = false;
  if (recTick){ clearInterval(recTick); recTick = null; }
  if (aiMaxTimer){ clearTimeout(aiMaxTimer); aiMaxTimer = null; }
  try{ mediaRec.stop(); }catch(_){}
}

async function aiFinish(){
  try{ mediaStream && mediaStream.getTracks().forEach(t=>t.stop()); }catch(_){}
  resetMicUI();
  if (document.getElementById('holdBtn').classList.contains('holding')){
    holdBtn.classList.remove('holding');
    holdBtn.textContent = '📻';
  }
  const blob = new Blob(mediaChunks, { type: (mediaRec && mediaRec.mimeType) || 'audio/webm' });
  if (blob.size < 2000){
    live.classList.remove('show');
    showError('녹음이 너무 짧아요. 다시 시도해주세요.');
    return;
  }
  speak('녹음 끝. 정리할게요.');
  statusBox.classList.add('show');
  statusText.textContent = 'AI가 받아적는 중...';
  try{
    const fd = new FormData();
    const ext = ((mediaRec && mediaRec.mimeType) || '').includes('mp4') ? 'm4a' : 'webm';
    fd.append('file', blob, 'voice.' + ext);
    fd.append('model', 'whisper-1');
    fd.append('language', 'ko');
    // 업계 용어 + 사전을 힌트로 줘서 정확도 올리기
    const vocab = ['아크릴','재단','밴딩','절곡','CNC','UV인쇄','접착','포맥스','MC나일론','POM','5T','3T','2T','8T','10T','견적','납품','원장','거래처']
      .concat(store.dict.map(d=>d.split('>').pop().trim()));
    fd.append('prompt', '아크릴 가공 공장 대화. 용어: ' + vocab.join(', '));
    const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + okey() },
      body: fd
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || '음성 AI 오류');
    let text = (data.text || '').trim();
    if (!text){
      live.classList.remove('show');
      showError('들린 말이 없어요.');
      statusBox.classList.remove('show');
      return;
    }
    // 교정 규칙 사전 적용
    store.dict.forEach(d=>{
      const p = d.split('>');
      if (p.length === 2 && p[0].trim() && p[1].trim()){
        text = text.split(p[0].trim()).join(p[1].trim());
      }
    });
    live.innerHTML = escapeHtml(text);
    statusBox.classList.remove('show');
    classifyText(text);
  }catch(err){
    statusBox.classList.remove('show');
    live.classList.remove('show');
    if (String(err.message).toLowerCase().includes('incorrect api key') || String(err.message).toLowerCase().includes('invalid')){
      showError('음성 AI 키가 잘못됐어요. ⚙️ 설정의 🎧 키를 확인해주세요.');
    } else {
      showError('받아적기 실패: ' + escapeHtml(err.message));
    }
  }
}

/* ---------- 엔진 분배기: 키 있으면 AI 귀, 없으면 크롬 귀 ---------- */
function startListening(){
  if (aiEar()) aiStart();
  else wsStart();
}
function requestStop(){
  if (aiEar()) aiStop();
  else wsStop();
}

// 🎤 버튼: 톡 눌러 시작 / 다시 톡 눌러 종료 (토글 전용)
micBtn.addEventListener('click', () => {
  if (!SR && !aiEar()) {
    showError('이 브라우저는 음성 인식을 지원하지 않아요. ⚙️ 설정에 🎧 음성 AI 키를 넣으면 사용할 수 있어요.');
    return;
  }
  if (!listening && !stopping) startListening();
  else if (listening) requestStop();
});

// 📻 무전기 버튼: 꾹 누르는 동안만 듣고, 떼면 종료 (전용)
const holdBtn = document.getElementById('holdBtn');
holdBtn.addEventListener('contextmenu', (e) => e.preventDefault());

holdBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!SR && !aiEar()) {
    showError('이 브라우저는 음성 인식을 지원하지 않아요. ⚙️ 설정에 🎧 음성 AI 키를 넣으면 사용할 수 있어요.');
    return;
  }
  if (!listening && !stopping){
    holdBtn.classList.add('holding');
    holdBtn.textContent = '🔴';
    startListening();
  }
});

function holdRelease(){
  holdBtn.classList.remove('holding');
  holdBtn.textContent = '📻';

function finalizeRecording(){
  if (!stopping) return;

  if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
  resetMicUI();
  if (typeof holdRelease === 'function' && document.getElementById('holdBtn').classList.contains('holding')) holdRelease();
  let text = (finalText + ' ' + interimText).trim();
  text = text.replace(/녹음\s*시작/g, '').trim();
  text = collapseRepeats(text); // 반복 구절 압축 (갤럭시 2중 방어)
  // 교정 규칙 사전("잘못>올바름")을 먼저 무조건 적용
  store.dict.forEach(d=>{
    const p = d.split('>');
    if (p.length === 2 && p[0].trim() && p[1].trim()){
      text = text.split(p[0].trim()).join(p[1].trim());
    }
  });
  if (text){
    speak('녹음 끝. 정리할게요.');
    classifyText(text, altNotes);

    dbg('들린 말 없음 — 조용히 종료');

  }
}

// 앞말(base)의 끝과 새말(add)의 시작이 겹치면 새말에서 겹친 부분 제거
function trimOverlap(base, add){
  const b = base.trim();
  const a = add.trim();
  if (!b || !a) return add;
  const max = Math.min(b.length, a.length, 120);
  for (let len = max; len >= 4; len--){
    if (b.slice(-len) === a.slice(0, len)){
      return a.slice(len).trim() ? a.slice(len).replace(/^\s+/,'') + ' ' : '';
    }
  }
  return add;
}

// 같은 구절이 연달아 반복되면 한 번으로 압축 (예: "5T 재단 5T 재단 5T 재단" → "5T 재단")
function collapseRepeats(t){
  let prev = '';
  let cur = t + ' ';
  while (cur !== prev){
    prev = cur;
    cur = cur.replace(/((?:\S+\s+){2,6})\1+/g, '$1');  // 2~6단어 구절 반복 압축
    cur = cur.replace(/(\S+\s+)\1{2,}/g, '$1');         // 한 단어 3회 이상 반복 압축
  }
  return cur.replace(/\s{2,}/g, ' ').trim();
}

async function callClaude(prompt){
  const key = document.getElementById('keyInput').value.trim();
  const headers = { "Content-Type": "application/json" };
  if (key) {
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers,
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 3000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await res.json();
  if (data.error) {
    const msg = data.error.message || '알 수 없는 오류';
    if (!key) throw new Error('NOKEY');
    throw new Error(msg);
  }
  const raw = (data.content || []).map(c => c.text || '').join('');
  let clean = raw.replace(/```json|```/g, '').trim();
  // AI가 앞뒤에 말을 붙였어도 { } 부분만 골라내기
  const s = clean.indexOf('{');
  const e = clean.lastIndexOf('}');
  if (s === -1 || e === -1) throw new Error('AI 답변에서 결과를 찾지 못함');
  clean = clean.slice(s, e + 1);
  try {
    return JSON.parse(clean);
  } catch(parseErr){
    throw new Error('AI 답변 해석 실패 (답변이 잘렸을 수 있어요. 조금 나눠서 말해보세요)');
  }
}

function shrinkImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        let w = img.width, hgt = img.height;
        if (Math.max(w,hgt) > maxSize){
          const r = maxSize / Math.max(w,hgt);
          w = Math.round(w*r); hgt = Math.round(hgt*r);
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hgt;
        cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
        const out = cv.toDataURL('image/jpeg', 0.72).split(',')[1];
        if (!out || out.length < 100) throw new Error('변환 결과가 비어있음');
        resolve({ data: out, type: 'image/jpeg' });
      }catch(e){ fallbackRead(); }
    };
    img.onerror = ()=>fallbackRead();
    img.src = URL.createObjectURL(file);

    // 축소 실패 시: 원본을 그대로 읽어서 전송 (jpeg/png/webp/gif만 가능)
    function fallbackRead(){
      const ok = ['image/jpeg','image/png','image/webp','image/gif'];
      if (!ok.includes(file.type)){
        reject(new Error('이 사진 형식(' + (file.type||'알 수 없음') + ')은 읽을 수 없어요. 스크린샷(캡처)으로 다시 시도해보세요.'));
        return;
      }
      const r = new FileReader();
      r.onload = ()=>resolve({ data: String(r.result).split(',')[1], type: file.type });
      r.onerror = ()=>reject(new Error('사진 파일을 읽지 못했어요'));
      r.readAsDataURL(file);
    }
  });
}

async function callClaudeVision(promptText, imgData){
  // 용량 확인 (너무 크면 전송이 끊겨요)
  if (imgData.data.length > 4500000){
    throw new Error('사진이 너무 커요. 스크린샷(캡처)으로 다시 시도해보세요.');
  }
  const key = document.getElementById('keyInput').value.trim();
  const headers = { "Content-Type": "application/json" };
  if (key) {
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const body = JSON.stringify({
    model: "claude-sonnet-4-6",
    max_tokens: 3000,
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: imgData.type, data: imgData.data } },
      { type: "text", text: promptText }
    ]}]
  });

  let res = null, lastNetErr = null;
  for (let attempt = 1; attempt <= 2; attempt++){
    try{
      res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body });
      lastNetErr = null;
      break;
    }catch(netErr){
      lastNetErr = netErr;
      statusText.textContent = '연결이 끊겨서 다시 시도 중... (' + attempt + '/2)';
      await new Promise(r=>setTimeout(r, 1200));
    }
  }
  if (lastNetErr) throw new Error('인터넷 전송이 끊겼어요. 와이파이/데이터 상태를 확인하고 다시 시도해주세요.');

  const data = await res.json();
  if (data.error) {
    if (!key) throw new Error('NOKEY');
    throw new Error(data.error.message || '알 수 없는 오류');
  }
  const raw = (data.content || []).map(c => c.text || '').join('');
  let clean = raw.replace(/```json|```/g, '').trim();
  const s = clean.indexOf('{');
  const e = clean.lastIndexOf('}');
  if (s === -1 || e === -1) throw new Error('AI 답변에서 결과를 찾지 못함');
  return JSON.parse(clean.slice(s, e + 1));
}

- 한국어 받아쓰기 특유의 오류를 교정하세요:
  · 숫자가 쪼개짐: "천 이백" → "1200", "열 장" → "10장", "다섯 개" → "5개"
  · 단위 오인: "티"/"미리"/"밀리" → T/mm 문맥에 맞게, "바이" → "×" (예: "천이백 바이 육백" → "1200×600")
  · 비슷한 발음 혼동: 재단/제단/재판, 절곡/절곡기, 납품/납부, 견적/전적
  · 군더더기 제거: "음", "어", "그", "저기", "이제", "막" 같은 추임새는 빼고 정리
  · 같은 말을 더듬어 반복한 것은 한 번으로 정리
- 두께: "오티/오 티/OT/5티" → "5T", "삼티/3티" → "3T", "이티/2티" → "2T", "팔티" → "8T", "십티/10티" → "10T"
- 치수: "천이백에 육백" → "1200×600", "천에 이천" → "1000×2000" (mm 단위)
- 수량: "열 장" → "10장", "다섯 장" → "5장"
- 가격: "만오천 원" → "15,000원", "장당 만이천" → "장당 12,000원"
- 자재: 투명/백색/흑색/미러/스모그 아크릴, MC나일론, POM, PC, PVC 포맥스
- 가공: 재단, 밴딩, CNC, UV인쇄, 접착, 열가공
- 숫자+단위는 항상 아라비아 숫자로 통일

/* ---------- 분류 결과 등록 (공용) ---------- */
function applyItems(parsed){
  let addedWork = false;
  let askAnswer = '';
  let updated = 0;
  (parsed.items||[]).forEach(it => {
    if (it.type === 'chat') return;
    if (it.type === 'ask'){ askAnswer = it.answer || ''; return; }
    if (it.type === 'update'){
      const list = it['목록'] === 'memo' ? store.memo : store.work;
      const t = list[it['번호']];
      if (t && it.text){ t.text = it.text; updated++; }
      return;
    }
    if (it.type === 'work'){
      const wt = ['재단','가공','후작업'].includes(it.work_type) ? it.work_type : '기타';
      store.work.push({ text: it.text, why: it.why||'', due: it.due||'', priority: it.priority||3, done:false, work: wt, who: currentUser, specs: Array.isArray(it.specs)?it.specs:[] });
      addedWork = true;
    } else {
      store.memo.push({ text: it.text, why: it.why||'', due: it.due||'', priority: it.priority||3, done:false, who: currentUser });
    }
  });
  saveAll();
  render();
  if (askAnswer){
    document.getElementById('jarvisText').textContent = askAnswer;
    document.getElementById('jarvis').classList.add('show');
    speak(askAnswer);
  }
  if (updated && !askAnswer) speak(updated + '건 수정했어요.');
  if (addedWork && store.work.filter(t=>!t.done).length > 1) prioritizeToday(true);
}

/* ---------- 오늘 정리 (작업 순서 배치) ---------- */
sortBtn.addEventListener('click', ()=>prioritizeToday(false));

async function prioritizeToday(auto){
  const remaining = store.work.map((it,i)=>({i, text:it.text, due:it.due||'', work:it.work||'기타', done:!!it.done}))
                              .filter(x=>!x.done);
  if (!remaining.length){ if(!auto) showError('남은 작업이 없어요! 🎉'); return; }
  hideError();
  sortBtn.disabled = true;
  statusBox.classList.add('show');
  statusText.textContent = auto ? '작업 순서 배치 중...' : '우선순위 정리 중...';

  const today = new Date();
  const dateStr = (today.getMonth()+1) + '월 ' + today.getDate() + '일';

  const prompt = `당신은 아크릴 가공 공장 사장님의 비서입니다. 오늘은 ${dateStr}입니다.
아래는 남은 작업 지시 목록입니다. 각 작업의 우선순위를 매기고, 실제로 먼저 해야 하는 순서대로 정렬하세요.

순서 기준: 기한 임박 > 시간 약속 > 납기·거래처 관련 > 공정 순서(재단이 가공보다 먼저, 가공이 후작업보다 먼저인 게 자연스러움) > 짧게 끝나는 일.
priority: 1(급함: 오늘까지거나 시간이 정해짐), 2(보통), 3(여유)

반드시 아래 JSON 형식으로만, 실행 순서대로 정렬해서 답하세요. 다른 말, 백틱 금지.
{"items":[{"i":0,"priority":1,"due":"오늘"}]}
due는 기존 값 유지, 새로 알 수 있으면 채우고, 모르면 "".

작업 목록:
${JSON.stringify(remaining.map(({i,text,due,work})=>({i,text,due,work})))}`;

  try {
    const parsed = await callClaude(prompt);
    (parsed.items || []).forEach((u, pos) => {
      const t = store.work[u.i];
      if (t){
        t.priority = u.priority || t.priority || 3;
        if (u.due !== undefined) t.due = u.due;
        t.rank = pos;
      }
    });
    saveAll();
    render();
    if (!auto){
      const urgent = store.work.filter(t=>!t.done && (t.priority||3)===1).length;
      speak(urgent ? '정리했어요. 급한 작업이 ' + urgent + '개 있어요.' : '정리했어요. 오늘 급한 작업은 없어요.');
    }
  } catch(err){
    if (!auto) showError('우선순위 정리 중 문제가 생겼어요. 다시 시도해주세요.');
    console.error(err);
  } finally {
    sortBtn.disabled = false;
    statusBox.classList.remove('show');
  }
}

/* ---------- 화면 그리기 ---------- */
function prioBadge(it){
  const p = it.priority || 3;
  if (p === 3) return '';
  return '<span class="badge p'+p+'">'+(p===1?'급함':'보통')+'</span>';
}
function matClass(c){
  if (!c) return 'sp';
  if (c.includes('투명')) return 'sp sp-clear';
  if (c.includes('백') || c.includes('화이트') || c.includes('흰') || c.includes('유백')) return 'sp sp-white';
  if (c.includes('흑') || c.includes('검') || c.includes('블랙')) return 'sp sp-black';
  if (c.includes('미러') || c.includes('거울')) return 'sp sp-mirror';
  if (c.includes('스모그') || c.includes('스모크') || c.includes('그레이') || c.includes('회')) return 'sp sp-smoke';
  if (c.includes('갈') || c.includes('브라운')) return 'sp sp-brown';
  if (c.includes('블루') || c.includes('파')) return 'sp sp-blue';
  return 'sp';
}
function specsHtml(it){
  if (!it.specs || !it.specs.length) return '';
  const rows = it.specs.map(s=>{
    const parts = [];
    if (s['소재']) parts.push('<span class="sp-mat">'+escapeHtml(s['소재'])+'</span>');
    else if (s['색상'] || s['두께']) parts.push('<span class="sp-mat">아크릴</span>');
    if (s['색상']) parts.push('<span class="'+matClass(s['색상'])+'">'+escapeHtml(s['색상'])+'</span>');
    if (s['두께']) parts.push('<span class="sp-t">'+escapeHtml(s['두께'])+'</span>');
    if (s['사이즈']) parts.push('<span class="sp-size">'+escapeHtml(s['사이즈'])+'</span>');
    if (s['수량']) parts.push('<span class="sp-qty">'+escapeHtml(s['수량'])+'</span>');
    return parts.length ? '<div class="spec-row">'+parts.join('')+'</div>' : '';
  }).filter(Boolean);
  return rows.length ? '<div class="specs">'+rows.join('')+'</div>' : '';
}
// 카드 제목에서 작업번호(A-2601 등)를 분리
function splitJob(text){
  const m = String(text).match(/^\s*([A-Za-z]{1,3}[-\s]?\d{2,6})\s*[·:\-]?\s*(.*)$/);
  if (m && m[2]) return { code: m[1].replace(/\s+/,'-'), rest: m[2].trim() };
  return { code: '', rest: String(text) };
}
function itemHtml(kind, it, i, num){
  const base = kind.split(' ')[0]; // 'work' 또는 'memo'
  const j = splitJob(it.text);
  const urgent = (it.priority||3) === 1;
  const head = '<div class="job-head">'
    + (num ? '<span class="ord">'+num+'</span>' : '')
    + prioBadge(it)
    + '<span class="job-title">'+escapeHtml(j.code || j.rest)+'</span>'
    + (it.due ? '<span class="job-due'+(urgent?' urgent':'')+'">'+escapeHtml(it.due)+'</span>' : '')
    + '</div>';
  const sub = (j.code && j.rest)
    ? '<div class="job-sub">'+escapeHtml(j.rest)+(it.who?'<span class="who-tag">'+escapeHtml(it.who)+'</span>':'')+'</div>'
    : (it.who ? '<div class="job-sub"><span class="who-tag">'+escapeHtml(it.who)+'</span></div>' : '');
  const note = it.why ? '<div class="job-note">'+escapeHtml(it.why)+'</div>' : '';
  return '<div class="item '+kind+(it.done?' done':'')+'">'
    + '<button class="chk" onclick="toggleDone(\''+base+'\','+i+')">'+(it.done?'✓':'')+'</button>'
    + '<div class="body" onclick="editItem(\''+base+'\','+i+')">'
    + head + sub + specsHtml(it) + note
    + '</div>'
    + '<button class="del" onclick="removeItem(\''+base+'\','+i+')">✕</button>'
    + '</div>';
}

function render(){
  /* 작업 지시 */
  const workRemain = store.work.filter(t=>!t.done).length;
  document.getElementById('cntWork').textContent = workRemain;

  if (!store.work.length){
    workArea.innerHTML = '<div class="empty">없음</div>';
  } else {
    const sorted = store.work.map((it,i)=>({it,i}))
      .sort((a,b)=>((a.it.done?1:0)-(b.it.done?1:0)) || ((a.it.rank??999)-(b.it.rank??999)) || ((a.it.priority||3)-(b.it.priority||3)));
    let n = 0;
    const numMap = {};
    sorted.forEach(o=>{ if(!o.it.done) numMap[o.i] = ++n; });

    let html = '';
    WORK_GROUPS.forEach(g=>{
      const members = sorted.filter(o=>(o.it.work||'기타')===g.key);
      if (!members.length) return;
      const remain = members.filter(o=>!o.it.done).length;
      html += '<div class="grp-head g-'+g.key+(remain?'':' g-empty')+'">'+g.label+' · '+remain+'건</div>';
      html += members.map(o=>itemHtml('work w-'+(o.it.work||'기타'), o.it, o.i, o.it.done?0:numMap[o.i])).join('');
    });
    workArea.innerHTML = html;
  }

  /* 잊지 말 것 */
  const memoRemain = store.memo.filter(t=>!t.done).length;
  document.getElementById('cntMemo').textContent = memoRemain;

  if (!store.memo.length){
    memoArea.innerHTML = '<div class="empty">없음</div>';
  } else {
    const sorted = store.memo.map((it,i)=>({it,i}))
      .sort((a,b)=>((a.it.done?1:0)-(b.it.done?1:0)) || ((a.it.priority||3)-(b.it.priority||3)));
    memoArea.innerHTML = sorted.map(o=>itemHtml('memo', o.it, o.i, 0)).join('');
  }
}

/* ---------- 공유 접수 (안드로이드: 공유 → 클라로) ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});

(async function handleShared(){
  const params = new URLSearchParams(location.search);
  if (params.get('shared') !== '1') return;
  history.replaceState(null, '', location.pathname); // 주소 정리
  try{
    const cache = await caches.open('klaro-share');
    const imgRes = await cache.match('shared-image');
    const txtRes = await cache.match('shared-text');
    const sharedText = txtRes ? (await txtRes.text()).trim() : '';
    if (imgRes){
      const blob = await imgRes.blob();
      await cache.delete('shared-image');
      await cache.delete('shared-text');
      dbg('📥 공유받은 사진 접수 중...');
      processSharedImage(blob);
    } else if (sharedText){
      await cache.delete('shared-text');
      dbg('📥 공유받은 글 접수 중...');
      classifyText(sharedText);
    }
  }catch(err){ console.error(err); }
})();

async function processSharedImage(blob){
  hideError();
  statusBox.classList.add('show');
  statusText.textContent = '사진 준비 중...';
  let imgData;
  try{
    imgData = await shrinkImage(blob, 1100);
  }catch(prepErr){
    showError('공유받은 사진을 읽지 못했어요: ' + escapeHtml(prepErr.message));
    statusBox.classList.remove('show');
    return;
  }
  statusText.textContent = '사진 읽는 중...';
  const prompt = photoPrompt();
  try{
    const parsed = await callClaudeVision(prompt, imgData);
    if (!parsed.items || !parsed.items.length){
      showError('사진에서 작업 내용을 찾지 못했어요.');
    } else {
      applyItems(parsed);
      speak('공유받은 사진에서 ' + parsed.items.length + '건 등록했어요.');
    }
  }catch(err){
    showError('사진 읽기 실패: ' + escapeHtml(err.message));
  }finally{
    statusBox.classList.remove('show');
  }
}

/* ---------- 깜빡 방지 브리핑 ---------- */
function buildBriefing(){
  const urgentWork = store.work.filter(t=>!t.done && (t.priority||3)===1);
  const urgentMemo = store.memo.filter(t=>!t.done && (t.priority||3)===1);
  const restWork = store.work.filter(t=>!t.done).length;
  const restMemo = store.memo.filter(t=>!t.done).length;
  if (!restWork && !restMemo) return null;
  let msg = '';
  const urgent = [...urgentWork, ...urgentMemo];
  if (urgent.length){
    const names = urgent.slice(0,3).map(t=>t.text).join(', ');
    msg = '급한 일 ' + urgent.length + '개가 남아 있어요. ' + names + (urgent.length>3?' 등이에요.':' 이에요.');
  } else {
    msg = '급한 일은 없고, 작업 ' + restWork + '개, 잊지 말 것 ' + restMemo + '개가 남아 있어요.';
  }
  return msg;
}
let briefMsg = '';
function updateBriefing(){
  const msg = buildBriefing();
  const box = document.getElementById('brief');
  if (!msg){ box.classList.remove('show'); briefMsg=''; return; }
  briefMsg = msg;
  document.getElementById('briefText').textContent = '🔔 ' + msg;
  box.classList.add('show');
}
document.getElementById('briefBtn').addEventListener('click', ()=>{ if(briefMsg) speak(briefMsg); });
updateBriefing();
