<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말비서">
<meta name="theme-color" content="#eef3f7">
<link rel="apple-touch-icon" href="icon.png">
<title>말비서</title>
<style>
  :root{
    --ink:#1c2733;
    --ink-soft:#5b6b7c;
    --bg:#eef3f7;
    --card:#ffffff;
    --accent:#1273b8;      /* 아크릴 블루 */
    --accent-deep:#0b5a94;
    --todo:#1273b8;
    --todo-bg:#e7f2fb;
    --note:#b07a10;
    --note-bg:#fdf3dd;
    --chat:#7c8794;
    --chat-bg:#f0f2f5;
    --danger:#c0392b;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button,.mic-zone,.section-head,header{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif;
    background:linear-gradient(165deg,#f4f8fb 0%,#e6eef6 55%,#dfeaf3 100%);
    color:var(--ink);
    display:flex;justify-content:center;
    min-height:100%;
  }
  .app{width:100%;max-width:520px;padding:24px 18px 48px;}

  header{margin-bottom:20px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
  h1{font-size:26px;font-weight:800;margin-top:4px;line-height:1.25;}
  .sub{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  /* 마이크 영역 */
  .mic-zone{
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:var(--radius);
    padding:26px 20px 22px;
    text-align:center;
    box-shadow:0 8px 28px rgba(28,60,90,.10);
    margin-bottom:16px;
  }
  .mic-btn{
    width:110px;height:110px;border-radius:50%;
    border:none;cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #3f9be0, var(--accent) 60%, var(--accent-deep));
    color:#fff;font-size:42px;
    box-shadow:0 10px 24px rgba(18,115,184,.38);
    transition:transform .15s ease;
    position:relative;
  }
  .mic-btn:active{transform:scale(.94);}
  .mic-btn.listening{
    background:radial-gradient(circle at 32% 28%, #ff7a6b, #e64c3c 60%, #b93325);
    box-shadow:0 10px 24px rgba(230,76,60,.4);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(230,76,60,.35);}
    70%{box-shadow:0 0 0 22px rgba(230,76,60,0);}
    100%{box-shadow:0 0 0 0 rgba(230,76,60,0);}
  }
  .mic-label{margin-top:14px;font-size:15px;font-weight:600;color:var(--ink);}
  .mic-hint{margin-top:4px;font-size:12.5px;color:var(--ink-soft);}

  /* 실시간 자막 */
  .live{
    margin-top:16px;min-height:52px;
    background:#f5f9fc;border-radius:12px;
    padding:12px 14px;font-size:15px;line-height:1.55;
    color:var(--ink);text-align:left;
    display:none;
  }
  .live.show{display:block;}
  .live .interim{color:#93a3b3;}

  /* 직접 입력 */
  .type-zone{
    background:var(--card);border-radius:var(--radius);
    padding:14px;box-shadow:0 4px 16px rgba(28,60,90,.07);
    margin-bottom:22px;
  }
  .type-zone label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;}
  .type-row{display:flex;gap:8px;}
  .type-row input{
    flex:1;border:1.5px solid #dde6ee;border-radius:10px;
    padding:11px 12px;font-size:15px;font-family:inherit;outline:none;
  }
  .type-row input:focus{border-color:var(--accent);}
  .type-row button{
    border:none;border-radius:10px;padding:0 18px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .type-row button:disabled{opacity:.5;}

  /* 상태 메시지 */
  .status{
    display:none;align-items:center;gap:10px;
    font-size:14px;color:var(--ink-soft);
    margin-bottom:16px;padding:12px 14px;
    background:var(--card);border-radius:12px;
  }
  .status.show{display:flex;}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2.5px solid #d5e2ec;border-top-color:var(--accent);
    animation:spin .8s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{
    display:none;font-size:13.5px;line-height:1.55;color:#8a3a30;
    background:#fdecea;border-radius:12px;padding:12px 14px;margin-bottom:16px;
  }
  .error-box.show{display:block;}

  /* 결과 */
  .section{margin-bottom:18px;}
  .section-head{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .section-head .t{font-size:16px;font-weight:800;}
  .count{
    font-size:12px;font-weight:700;color:#fff;
    border-radius:99px;padding:2px 9px;min-width:24px;text-align:center;
  }
  .count.todo{background:var(--todo);}
  .count.note{background:var(--note);}
  .count.chat{background:var(--chat);}
  .empty{font-size:13.5px;color:#9aa8b6;padding:6px 2px;}

  .item{
    border-radius:14px;padding:13px 15px;margin-bottom:8px;
    font-size:15px;line-height:1.5;
    display:flex;gap:10px;align-items:flex-start;
    animation:slidein .3s ease;
  }
  @keyframes slidein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .item .mark{flex-shrink:0;font-size:16px;margin-top:1px;}
  .item .body{flex:1;}
  .item .why{font-size:12.5px;margin-top:3px;opacity:.75;}
  .item.todo{background:var(--todo-bg);color:#0d4a77;}
  .item.note{background:var(--note-bg);color:#7a5408;}
  .item.chat{background:var(--chat-bg);color:#5b6672;}
  .item button.del{
    border:none;background:none;color:inherit;opacity:.4;
    font-size:15px;cursor:pointer;padding:2px;flex-shrink:0;
  }

  .clear-row{text-align:center;margin-top:26px;}
  .clear-row button{
    border:none;background:none;color:#9aa8b6;font-size:13px;
    text-decoration:underline;cursor:pointer;font-family:inherit;
  }
  footer{
    margin-top:30px;text-align:center;
    font-size:12px;color:#a5b2bf;line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">나만의 음성 비서</div>
    <h1>말비서</h1>
    <div class="sub">말하면 <b>할일과 기록</b>만 남기고, 잡담은 알아서 버립니다.</div>
  </header>

  <div class="mic-zone">
    <button class="mic-btn" id="micBtn" aria-label="녹음 시작">🎤</button>
    <div class="mic-label" id="micLabel">짧게 한 번 눌러 말하기</div>
    <div class="mic-hint" id="micHint">꾹 누르지 말고 톡! 한 번 · 끝나면 다시 톡!</div>
    <div class="live" id="live"></div>
    <div id="debugLine" style="margin-top:10px;font-size:12px;color:#8a97a5;text-align:left;line-height:1.5;background:#f5f9fc;border-radius:10px;padding:8px 12px;">상태: 대기 중</div>
  </div>

  <div class="type-zone">
    <label>🔑 API 키 (Claude 채팅 안에서는 비워두세요 · 파일로 열 때만 입력)</label>
    <div class="type-row">
      <input type="password" id="keyInput" placeholder="sk-ant-... 로 시작하는 키">
    </div>
  </div>

  <div class="type-zone">
    <label>🎤 마이크가 안 되면 여기에 직접 입력해보세요</label>
    <div class="type-row">
      <input type="text" id="typeInput" placeholder="예: 내일까지 3T 투명 재단하고 점심은 국밥 먹자">
      <button id="typeBtn">정리</button>
    </div>
  </div>

  <div class="status" id="status"><div class="spinner"></div><span id="statusText">정리하는 중...</span></div>
  <div class="error-box" id="errorBox"></div>

  <div class="section">
    <div class="section-head"><span>🔨</span><span class="t">할일 · 지시사항</span><span class="count todo" id="cntTodo">0</span></div>
    <div id="listTodo"><div class="empty">아직 없어요. 말해보세요!</div></div>
  </div>

  <div class="section">
    <div class="section-head"><span>📋</span><span class="t">기록해둘 정보</span><span class="count note" id="cntNote">0</span></div>
    <div id="listNote"><div class="empty">치수, 가격, 납기 같은 정보가 여기 모여요.</div></div>
  </div>

  <div class="clear-row"><button id="clearBtn">전체 지우기</button></div>

  <footer>할일과 기록은 이 폰에 자동 저장됩니다.<br>말비서 v1.0</footer>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const micLabel = document.getElementById('micLabel');
const micHint = document.getElementById('micHint');
const live = document.getElementById('live');
const statusBox = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errorBox = document.getElementById('errorBox');
const typeInput = document.getElementById('typeInput');
const typeBtn = document.getElementById('typeBtn');

const lists = {
  todo: document.getElementById('listTodo'),
  note: document.getElementById('listNote')
};
const counts = {
  todo: document.getElementById('cntTodo'),
  note: document.getElementById('cntNote')
};
const marks = { todo:'🔨', note:'📋' };
const store = { todo:[], note:[] };

/* ---------- 저장 기능 (폰에 기억) ---------- */
function saveAll(){
  try{
    localStorage.setItem('mb_items', JSON.stringify(store));
  }catch(_){}
}
function loadAll(){
  try{
    const raw = localStorage.getItem('mb_items');
    if (raw){
      const d = JSON.parse(raw);
      if (d.todo) store.todo = d.todo;
      if (d.note) store.note = d.note;
    }
    const k = localStorage.getItem('mb_key');
    if (k) document.getElementById('keyInput').value = k;
  }catch(_){}
}
document.getElementById('keyInput').addEventListener('change', function(){
  try{ localStorage.setItem('mb_key', this.value.trim()); }catch(_){}
});

/* ---------- 상태 진단 표시 ---------- */
const debugLine = document.getElementById('debugLine');
function dbg(msg){
  const t = new Date().toLocaleTimeString('ko-KR');
  debugLine.innerHTML = '상태: ' + msg + ' <span style="opacity:.5">(' + t + ')</span>';
}

/* ---------- 시작 신호음 (삐) ---------- */
let audioCtx = null;
function beep(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  }catch(_){}
}

/* ---------- 음성 안내 (TTS) ---------- */
function speak(msg, done){
  try{
    const u = new SpeechSynthesisUtterance(msg);
    u.lang = 'ko-KR';
    u.rate = 1.05;
    let called = false;
    const fin = ()=>{ if(!called){ called = true; done && done(); } };
    u.onend = fin;
    u.onerror = fin;
    if (speechSynthesis.speaking) speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(fin, 1800); // 음성이 안 나와도 진행되게 안전장치
  }catch(_){ done && done(); }
}

/* ---------- 음성 인식 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let listening = false;   // 지금 녹음 중인가
let stopping = false;    // 종료 처리 중인가
let stopTimer = null;
let finalText = '';
let interimText = '';
let restartCount = 0;
let restartWindow = 0;

if (SR) {
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onstart = () => { dbg('🔴 마이크 켜짐! 말씀하세요'); };

  rec.onresult = (e) => {
    interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' ';
      else interimText += t;
    }
    dbg('🟢 목소리 인식되는 중');
    live.classList.add('show');
    live.innerHTML = escapeHtml(finalText) + '<span class="interim">' + escapeHtml(interimText) + '</span>';
  };

  rec.onerror = (e) => {
    dbg('⚠️ 오류 발생: <b>' + e.error + '</b>');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      resetMicUI();
      listening = false;
      showError('마이크 사용이 막혀 있어요. 원인: <b>' + e.error + '</b><br>· 컴퓨터라면: 주소창 왼쪽 자물쇠 → 마이크 → 허용<br>· 아이폰이라면: 설정 → Siri → "받아쓰기" 켜기 확인');
    }
    // no-speech, aborted 등은 무시하고 onend에서 알아서 처리
  };

  rec.onend = () => {
    if (stopping) {
      dbg('⏹ 녹음 종료, 정리 시작');
      // 사용자가 종료 버튼을 눌러서 끝난 경우 → 여기서 확실하게 마무리
      finalizeRecording();
    } else if (listening) {
      // 재시작이 3초 안에 6번 넘게 반복되면 = 이 기기에서 연속 인식 불가 → 멈추고 알림
      const now = Date.now();
      if (now - restartWindow > 3000) { restartWindow = now; restartCount = 0; }
      restartCount++;
      if (restartCount > 6) {
        listening = false;
        resetMicUI();
        dbg('⛔ 이 브라우저에서 연속 인식이 불안정해요');
        showError('이 환경에서는 음성 인식이 계속 끊겨요. <b>사파리에서 직접 열었는지</b> 확인해주세요. (홈 화면 아이콘/카카오톡 내부 브라우저에서는 안 될 수 있어요)');
        return;
      }
      dbg('🔄 잠깐 끊김, 다시 연결 중...');
      setTimeout(() => {
        if (listening && !stopping) { try { rec.start(); } catch(_){} }
      }, 250);
    } else {
      dbg('마이크 꺼짐');
    }
  };
}

micBtn.addEventListener('contextmenu', (e) => e.preventDefault());

micBtn.addEventListener('click', () => {
  if (!SR) {
    showError('이 브라우저는 음성 인식을 지원하지 않아요. 아래 <b>직접 입력</b>으로 테스트해보세요.');
    return;
  }
  if (!listening && !stopping) startListening();
  else if (listening) requestStop();
});

function startListening(){
  hideError();
  finalText = '';
  interimText = '';
  live.innerHTML = '';
  live.classList.add('show');
  listening = true;
  micBtn.classList.add('listening');
  micBtn.textContent = '⏹';
  micLabel.textContent = '듣고 있어요...';
  micHint.textContent = '끝나면 버튼을 다시 톡!';
  // 시작 안내는 "삐" 소리로 (아이폰에서 음성안내+마이크 동시 사용 시 멈추는 문제 방지)
  beep();
  dbg('마이크 켜는 중...');
  try { rec.start(); } catch(err){ dbg('⚠️ 시작 실패: ' + err.name); }
}

function requestStop(){
  listening = false;
  stopping = true;
  micLabel.textContent = '마무리하는 중...';
  try { rec.stop(); } catch(_){ finalizeRecording(); return; }
  // 브라우저가 onend를 안 불러줄 때를 대비한 안전장치 (2초)
  stopTimer = setTimeout(finalizeRecording, 2000);
}

function finalizeRecording(){
  if (!stopping) return;
  stopping = false;
  if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
  resetMicUI();
  let text = (finalText + ' ' + interimText).trim();
  // 안내 음성("녹음 시작")이 마이크에 섞여 들어갔으면 지워줌
  text = text.replace(/녹음\s*시작/g, '').trim();
  speak('녹음 끝. 정리할게요.');
  if (text) classifyText(text);
  else showError('들린 말이 없어요. 조금 더 크게 말하거나 직접 입력을 사용해보세요.');
}

function resetMicUI(){
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤';
  micLabel.textContent = '짧게 한 번 눌러 말하기';
  micHint.textContent = '꾹 누르지 말고 톡! 한 번 · 끝나면 다시 톡!';
}

/* ---------- 직접 입력 ---------- */
typeBtn.addEventListener('click', submitTyped);
typeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitTyped(); });
function submitTyped(){
  const t = typeInput.value.trim();
  if (!t) return;
  typeInput.value = '';
  classifyText(t);
}

/* ---------- Claude 분류 ---------- */
async function classifyText(text){
  hideError();
  statusBox.classList.add('show');
  statusText.textContent = '정리하는 중...';
  typeBtn.disabled = true;

  const prompt = `당신은 아크릴 가공 공장에서 일하는 사장님의 음성 비서입니다.
아래는 사장님이 일하면서 한 말을 받아적은 것입니다. 이 내용을 문장/의미 단위로 나눠서 세 종류로 분류하세요.

- "todo": 해야 할 일, 작업 지시, 약속, 부탁받은 것 (예: 재단하기, 전화하기, 납품하기)
- "note": 기억해둘 정보 - 치수, 수량, 가격, 견적, 납기일, 자재 이름, 연락처 등 숫자나 사실 정보
- "chat": 일과 무관한 잡담, 감탄, 혼잣말

규칙:
- 한 문장에 할일과 정보가 섞여 있으면 둘 다 뽑아도 됩니다.
- text는 핵심만 간결하게 다듬어 쓰세요 (받아적은 말투 그대로 X).
- todo에는 가능하면 why에 기한이나 대상 등 놓치면 안 되는 포인트를 짧게 적으세요. 없으면 생략.
- 반드시 아래 JSON 형식으로만 답하세요. 다른 말, 마크다운 백틱 절대 금지.

{"items":[{"type":"todo","text":"...","why":"..."},{"type":"note","text":"..."},{"type":"chat","text":"..."}]}

받아적은 내용:
"""${text}"""`;

  try {
    const key = document.getElementById('keyInput').value.trim();
    const headers = { "Content-Type": "application/json" };
    if (key) {
      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    if (data.error) {
      const key = document.getElementById('keyInput').value.trim();
      if (!key) {
        showError('AI 연결에 실패했어요. <b>다운로드한 파일로 여신 경우, 위 🔑 칸에 API 키를 넣어야</b> AI 분류가 작동합니다.');
      } else {
        showError('AI 오류: ' + escapeHtml(data.error.message || '알 수 없음') + '<br>키가 올바른지 확인해주세요.');
      }
      return;
    }
    const raw = (data.content || []).map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    if (!parsed.items || !parsed.items.length) throw new Error('empty');
    parsed.items.forEach(it => {
      if (it.type === 'chat') return; // 잡담은 버림
      const type = ['todo','note'].includes(it.type) ? it.type : 'note';
      store[type].push({ text: it.text, why: it.why || '' });
    });
    saveAll();
    render();
    live.classList.remove('show');
  } catch(err){
    showError('정리 중 문제가 생겼어요. 한 번 더 시도해주세요.');
    console.error(err);
  } finally {
    statusBox.classList.remove('show');
    typeBtn.disabled = false;
  }
}

/* ---------- 화면 그리기 ---------- */
function render(){
  ['todo','note'].forEach(type=>{
    const arr = store[type];
    counts[type].textContent = arr.length;
    if (!arr.length){
      const msg = type==='todo' ? '아직 없어요. 말해보세요!'
                : '치수, 가격, 납기 같은 정보가 여기 모여요.';
      lists[type].innerHTML = '<div class="empty">'+msg+'</div>';
      return;
    }
    lists[type].innerHTML = arr.map((it,i)=>`
      <div class="item ${type}">
        <span class="mark">${marks[type]}</span>
        <div class="body">${escapeHtml(it.text)}${it.why?'<div class="why">⏰ '+escapeHtml(it.why)+'</div>':''}</div>
        <button class="del" onclick="removeItem('${type}',${i})">✕</button>
      </div>`).join('');
  });
}

function removeItem(type,i){
  store[type].splice(i,1);
  saveAll();
  render();
}
window.removeItem = removeItem;

document.getElementById('clearBtn').addEventListener('click', ()=>{
  store.todo=[]; store.note=[];
  saveAll();
  render();
});

function showError(html){ errorBox.innerHTML = html; errorBox.classList.add('show'); }
function hideError(){ errorBox.classList.remove('show'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadAll();
render();
</script>
</body>
</html>
